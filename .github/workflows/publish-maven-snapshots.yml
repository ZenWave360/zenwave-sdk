name: Build and Publish Snapshots

on:
  push:
    branches: [develop, next]
  workflow_dispatch:
    inputs:
      publish-snapshots:
        description: "Also publish the verified SNAPSHOT artifacts to Maven Central (snapshots always go to zenwave360/maven-snapshots)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maven-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-snapshot:
    # Pilot for git-maven-publisher snapshots (zenwave360/maven-snapshots, branch gh-pages); back to @main once merged there.
    uses: ZenWave360/release-workflows/.github/workflows/publish-snapshots-maven.yml@feature/git-snapshots
    with:
      publish-snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.publish-snapshots }}
      publish-git-snapshots: true
      jacoco-csv-files: >
        ./plugins/asyncapi-spring-cloud-streams3/target/site/jacoco/jacoco.csv
        ./plugins/avro-schema-compiler/target/site/jacoco/jacoco.csv
        ./plugins/asyncapi-generator/target/site/jacoco/jacoco.csv
        ./plugins/java-to-jdl/target/site/jacoco/jacoco.csv
        ./plugins/java-to-asyncapi/target/site/jacoco/jacoco.csv
        ./plugins/backend-application-default/target/site/jacoco/jacoco.csv
        ./plugins/openapi-controllers/target/site/jacoco/jacoco.csv
        ./plugins/zdl-to-openapi/target/site/jacoco/jacoco.csv
        ./plugins/jdl-to-asyncapi/target/site/jacoco/jacoco.csv
        ./plugins/zdl-to-asyncapi/target/site/jacoco/jacoco.csv
        ./plugins/zdl-to-markdown/target/site/jacoco/jacoco.csv
        ./plugins/dsl-docs/target/site/jacoco/jacoco.csv
        ./plugins/openapi-spring-webtestclient/target/site/jacoco/jacoco.csv
        ./plugins/openapi-karate/target/site/jacoco/jacoco.csv
        ./plugins/asyncapi-ops/target/site/jacoco/jacoco.csv
        ./zenwave-sdk-cli/target/site/jacoco/jacoco.csv
        ./plugins/customizations/kotlin-backend-application/target/site/jacoco/jacoco.csv
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
      GIT_PUBLISHER_TOKEN: ${{ secrets.GIT_PUBLISHER_TOKEN }}

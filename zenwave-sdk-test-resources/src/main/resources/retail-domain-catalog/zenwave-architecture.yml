# yaml-language-server: $schema=https://schemas.zenwave360.io/zenwave-architecture/latest/schema.json

config:
  title: "ARTS-inspired Retail Event Catalog Playground"
  version: 0.0.1
  contentResolution:
    - workspace
    - git
  sources:
    git:
      provider: generic
      server: https://raw.githubusercontent.com/ZenWave360/zenwave-sdk/develop/zenwave-sdk-test-resources/src/main/resources/retail-domain-catalog
      contentUrlExpression: "${server}/${domain.id}/${subdomain.id}/${service.id}/${content.path}"

domains:
  "merchandising":
    name: "Merchandising"
    description: "ARTS Merchandising Area - Product planning, pricing and promotion management"
    subdomains:
      "inventory":
        name: "Inventory"
        description: "Inventory tracking and management subdomain"
        services:
          "inventory-adjustment":
            version: "1.0.0"
            name: "Inventory Adjustment"
            description: "ARTS Service Domain - Processes inventory adjustments and updates"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
              - type: asyncapi
                path: "asyncapi.yml"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
              - type: openapi
                path: "openapi.yml"
            consumers:
              - service: "merchandising/pricing/price-change"
              - $ref: "#/domains/customer-relationship/subdomains/customer-management/services/customer-profile"

          "stock-replenishment":
            version: "1.0.0"
            name: "Stock Replenishment"
            description: "ARTS Service Domain - Manages stock ordering and replenishment"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
              - type: asyncapi
                path: "asyncapi.yml"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
            consumers:
              - "merchandising/inventory/inventory-adjustment"

      "pricing":
        name: "Pricing"
        description: "Pricing strategies and adjustments subdomain"
        services:
          "price-change":
            version: "1.0.0"
            name: "Price Change"
            description: "ARTS Service Domain - Manages price updates and promotions"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
              - type: asyncapi
                path: "asyncapi.yml"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
            consumers:
              - service: "merchandising/inventory/inventory-adjustment"

  "customer-relationship":
    name: "Customer Relationship"
    description: "ARTS Customer Relationship Area - Customer management and loyalty programs"
    subdomains:
      "customer-management":
        name: "Customer Management"
        description: "Customer profile and relationship management subdomain"
        services:
          "customer-profile":
            version: "1.0.0"
            name: "Customer Profile"
            description: "ARTS Service Domain - Maintains customer profiles and data"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
              - type: asyncapi
                path: "asyncapi.yml"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
            consumers:
              - service: "customer-relationship/customer-management/loyalty-management"

          "loyalty-management":
            version: "1.0.0"
            name: "Loyalty Management"
            description: "ARTS Service Domain - Handles loyalty programs and points"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
              - type: asyncapi
                path: "asyncapi.yml"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
            consumers:
              - "#/domains/merchandising/subdomains/pricing/services/price-change"

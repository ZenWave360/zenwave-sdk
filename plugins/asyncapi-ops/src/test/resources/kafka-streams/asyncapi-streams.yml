asyncapi: 3.0.0
info:
  title: Inventory Adjustment Kafka Streams Topology
  version: 1.0.0
  description: Declares a Kafka Streams application that manages its own internal topics.

x-kafka-streams-applications:
  merchandising.inventory.inventory-adjustment.streams-app:
    x-principal: "merchandising.inventory.inventory-adjustment"
    x-transactionalIdPrefix: "merchandising.inventory.inventory-adjustment.streams-app-"

channels:
  stock-movement-event:
    address: merchandising.inventory.stock-movement.event.avro.v0
    summary: Stock Movement Event
    messages: {}
    bindings:
      kafka:
        partitions: 6
        replicas: 3

operations:
  processStockEvents:
    action: receive
    channel:
      $ref: '#/channels/stock-movement-event'
    bindings:
      kafka:
        x-principal: "merchandising.inventory.inventory-adjustment"
        x-groupId: "merchandising.inventory.inventory-adjustment.streams-app"
